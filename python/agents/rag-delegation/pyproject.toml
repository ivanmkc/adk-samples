[project]
name = "rag-delegation"
version = "0.1.0"
description = "A PoC for a root agent delegating to a RAG sub-agent."
authors = [
    {name = "Gemini", email = "gemini@google.com"},
]
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "pytest",
    "python-dotenv",
    "google-cloud-aiplatform",
    "pytest-mock",
    "llama_index",
    "google-search-results",
    "pytest-asyncio (>=1.1.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "rag_delegation"}]

[tool.pytest.ini_options]
asyncio_mode = "auto"
